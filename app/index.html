<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Snap</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Cover Snap</h1>
    <p>A photo and a caption, made into a square cover.</p>
    <label>Photo <input id="photo" type="file" accept="image/*"></label>
    <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>
    <button id="export" type="button">Export PNG 1080 x 1080</button>
    <p id="status" role="status"></p>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
